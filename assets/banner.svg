<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow & Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    /* Keyframe Animations for Dynamic Elements */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.3; }
      50% { transform: scale(1.05); opacity: 0.7; }
      100% { transform: scale(0.95); opacity: 0.3; }
    }

    @keyframes float-particle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    @keyframes node-glow {
      0%, 100% { fill: #38bdf8; filter: drop-shadow(0 0 2px #38bdf8); }
      50% { fill: #c084fc; filter: drop-shadow(0 0 8px #c084fc); }
    }

    .bg-grid { patternUnits: userSpaceOnUse; }
    .floating-shape-1 { animation: float-particle 8s ease-in-out infinite; transform-origin: center; }
    .floating-shape-2 { animation: float-particle 10s ease-in-out infinite 1s; transform-origin: center; }
    .pulsing-ring { animation: pulse-ring 6s ease-in-out infinite; transform-origin: 1050px 160px; }
    .connecting-line { stroke-dasharray: 8 8; animation: dash-flow 3s linear infinite; }
    .dynamic-node { animation: node-glow 4s ease-in-out infinite; }
    
    /* Typography Styles */
    .title-main { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .title-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; letter-spacing: 0.2px; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Background Decorative Glowing Orbs (Non-obstructive background dynamics) -->
  <circle cx="150" cy="80" r="180" fill="url(#glow-grad)"/>
  <circle cx="1050" cy="240" r="200" fill="url(#glow-grad)"/>

  <!-- Dynamic Network Graphic (Right Side - Completely Clear of Foreground Text) -->
  <g id="network-graphic" opacity="0.75">
    <!-- Pulsing Decentralized Hub Rings -->
    <circle class="pulsing-ring" cx="1020" cy="160" r="90" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
    <circle class="pulsing-ring" cx="1020" cy="160" r="130" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>

    <!-- Connecting Network Flow Lines -->
    <path class="connecting-line" d="M 850 160 L 940 100 L 1020 160 L 1100 110 M 1020 160 L 950 230 M 1020 160 L 1110 220" fill="none" stroke="#475569" stroke-width="2"/>

    <!-- Nodes / Entities (Wallets, DIDs, Verifiers) -->
    <circle class="floating-shape-1" cx="850" cy="160" r="8" fill="#06b6d4" filter="url(#glow)"/>
    <circle class="floating-shape-2" cx="940" cy="100" r="10" fill="#3b82f6"/>
    <circle class="dynamic-node" cx="1020" cy="160" r="14"/>
    <circle class="floating-shape-1" cx="1100" cy="110" r="9" fill="#8b5cf6"/>
    <circle class="floating-shape-2" cx="950" cy="230" r="11" fill="#ec4899"/>
    <circle class="floating-shape-1" cx="1110" cy="220" r="8" fill="#10b981"/>

    <!-- Labels on Graph (Decentralized Identity concepts) -->
    <text x="850" y="185" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Holder Wallet</text>
    <text x="940" y="82" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Issuer (OID4VCI)</text>
    <text x="1020" y="190" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">W3C DID / VC</text>
    <text x="1100" y="92" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Verifier (OID4VP)</text>
    <text x="950" y="255" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Zero-Knowledge Proof</text>
    <text x="1110" y="245" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Trust Registry</text>
  </g>

  <!-- Left Accent Bar -->
  <rect x="60" y="65" width="6" height="190" rx="3" fill="url(#accent-cyan)" filter="url(#glow)"/>

  <!-- Foreground Content Block (High Contrast & Clear Readability) -->
  <g id="foreground-text" transform="translate(85, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="280" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="17" class="badge-text">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" class="title-main" filter="url(#shadow)">
      Awesome Decentralized Identity
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="182" class="title-sub">
      Self-Sovereign Identity (SSI), Verifiable Credentials (VCs), Digital Wallets &amp; DIDs
    </text>

    <!-- Highlight Metrics/Badges Row in SVG Header -->
    <g transform="translate(0, 215)">
      <!-- Tech Badge 1 -->
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="55" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">W3C DID v1.0</text>

      <!-- Tech Badge 2 -->
      <rect x="120" y="0" width="120" height="24" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="180" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">SD-JWT &amp; mDL</text>

      <!-- Tech Badge 3 -->
      <rect x="250" y="0" width="130" height="24" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
      <text x="315" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#f472b6" text-anchor="middle">OID4VCI / OID4VP</text>

      <!-- Tech Badge 4 -->
      <rect x="390" y="0" width="140" height="24" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="460" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Zero-Knowledge Proofs</text>
    </g>
  </g>
</svg>
